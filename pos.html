<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}

/* POS 1.16 — POS palitrasi (Ibrohim tanlagan: #030F2C / #5183FF / #5F84DF / #93B2FF).
   FAQAT POS konteynerlari ichida amal qiladi. */
/* POS 1.29 — YORUG' fon (Ibrohim: «fon oq bo'lsin», faqat POS).
   Ranglar oq ustida o'qilishi uchun to'q ko'kdagilardan farq qiladi:
   urg'u #5183FF -> #3B6FE0, qarz #FF8B6B -> #D14A2E (kontrast 2.1 -> 4.4). */
body.rol-pos, #main-pos, #pos-ovl, #pb-ovl{
  --bg:#EEF1F7; --surf:#FFFFFF; --surf2:#F4F6FB; --border:#D8DEEA;
  --text:#0F1B33; --muted:#6B7894;
  --gold:#3B6FE0; --gold2:#3B6FE0;
  --gold-bg:rgba(59,111,224,.10); --gold-bd:#C3CFE8; --on-gold:#FFFFFF;
  --yellow:#3B6FE0; --yellow-bg:rgba(59,111,224,.10);
  --red:#D14A2E; --red-bg:rgba(209,74,46,.10); --red-bd:rgba(209,74,46,.34);
  --green:#1E8F62; --green-bg:rgba(30,143,98,.10); --green-bd:rgba(30,143,98,.34);
  --teal:#2E7D8F; --teal-bg:rgba(46,125,143,.10); --teal-bd:#C3CFE8;
  --blue:#3B6FE0; --blue-bg:rgba(59,111,224,.10); --blue-bd:#C3CFE8;
  color:var(--text);
}
/* POS 1.21: o'ng pastdagi versiya belgisi ham POS palitrasida */
/* POS 1.32 (Ibrohim: «pasdan versiyaniyam obtasha») — POS da pastdagi
   versiya belgisi ko'rinmaydi; u tepada «TILLA POS 1.32» bo'lib turibdi. */
body.rol-pos #app-ver{ display:none !important; }
/* POS 1.29 (Ibrohim: «iOS dizayn, rangiga emas formasiga») — tugma va maydonlar
   TO'LIQ PILL. !important kerak: POS kodi inline style bilan chiziladi. */
body.rol-pos button, body.rol-pos input,
#pos-ovl button, #pos-ovl input,
#pb-ovl button, #pb-ovl input,
#pos-bell-ovl button, #pos-bell-ovl input{ border-radius:999px !important; }
/* POS 1.21: klient oynasi sarlavhasi — tor ekranda amal pillari o'z qatoriga
   tushadi (avval avatar/ism bilan bir qatorda siqilib qolardi). */
#pos-ovl .pos-hd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
#pos-ovl .pos-pills{display:flex;gap:5px;flex:none;}
/* v0.24: pastki satrdagi amallar DOIM keng — barmoq uchun. */
#pos-ovl .pos-amal-past .pos-pills{gap:9px;}
#pos-ovl .pos-amal-past .pos-pills button{flex:1;justify-content:center;height:48px;font-size:12.5px;}
@media(max-width:700px){
  #pos-ovl .pos-pills{order:3;flex:1 1 100%;}
  #pos-ovl .pos-pills button{flex:1;justify-content:center;padding-left:8px;padding-right:8px;}
}

/* pos.html qobig'i — index.html dagi topbar/tablar o'rniga */
/* v0.04: safe-top QO'SHILMAYDI — renderPOS ning o'z sarlavhasi uni qo'yadi
   (padding:var(--safe-top) 2px 11px). Ikki marta qo'shilganda kontent pastga
   surilib, ro'yxatning oxiri kesilib qolardi. */
#main-pos{display:flex!important;flex-direction:column;height:100%;height:100dvh;min-width:0;overflow:hidden;padding:0 10px calc(10px + var(--safe-bot));}
#kirish{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
#kirish .box{width:100%;max-width:340px}
#kirish .brand{text-align:center;margin-bottom:24px}
#kirish .brand b{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
#kirish .brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
#kirish .card{background:var(--surf);border:1px solid var(--border);border-radius:22px;padding:20px}
#kirish .t{font-size:13px;font-weight:700;margin-bottom:13px}
#kirish input{width:100%;padding:13px 16px;border:1.5px solid var(--border);background:var(--surf2);margin-bottom:9px;outline:none}
#kirish input:focus{border-color:var(--gold);background:var(--surf)}
#kirish .go{width:100%;padding:13px;background:var(--gold);color:var(--on-gold);font-weight:700;margin-top:3px}
#kirish .go:disabled{opacity:.5}
#kirish .err{color:var(--red);font-size:12.5px;min-height:18px;text-align:center;margin-top:7px}
#kirish .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
#kirish .xona{display:inline-block;background:var(--red-bg);color:var(--red);padding:3px 11px;font-size:10.5px;font-weight:800;letter-spacing:.08em;margin-bottom:12px;border-radius:999px}
/* v0.04: avval yuqori o'ngda edi — renderPOS ning KURS pilli AYNI o'sha joyda,
   ustma-ust tushardi. Endi pastki chap burchakda. */
/* v0.21: cloud belgisi TEPA SATRGA ko'chdi (Ibrohim: «huddi tilla erpga o'xshab»). */
#pos-holat{display:none}
#pos-holat .d{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#pos-holat .d.ok{background:var(--green)}#pos-holat .d.no{background:var(--red)}#pos-holat .d.wait{background:var(--gold)}
#chek-xabar{position:fixed;left:50%;top:calc(12px + var(--safe-top));transform:translateX(-50%);z-index:9600;background:var(--surf);border:1px solid var(--border);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.16);display:none}
#chek-xabar.ok{border-color:var(--green-bd);color:var(--green)}
#chek-xabar.xato{border-color:var(--red-bd);color:var(--red)}
</style>

<script>
// ════════════════════════════════════════════════════════════
// TILLA POS — v0.02
//
// Ibrohim (2026-09-09): «manga yangi Amerika ochma» — POS ekranlari
// index.html dan O'ZGARTIRILMASDAN ko'chirildi. Yangi dizayn yasalmadi.
// 51 funksiya, CSS palitrasi va element id lari — hammasi AYNI o'sha.
//
// ⚠ QAMROV:
//   • SINOV XONASI QOTIRILGAN — `SANDBOX` o'zgarmas.
//   • Cloudga YOZADIGAN yagona joy: `posBSaqla` → `_poschernovik` (chernovik).
//     `holat`, `holat_bN`, `_amallar` ga YOZILMAYDI — hisobga tegmaydi.
//   • `index.html` va `hisob.js` ga tegilmagan.
// ════════════════════════════════════════════════════════════

var POS_VER = 'v0.28';

// ── SINOV XONASI — QOTIRILGAN ────────────────────
var SANDBOX = 'TEST';
// ───────────────────────────────────────────

var CREDS = [{ login:'test', parol:'test123' }];
var FB = {
  apiKey: "AIzaSyAfZ45TmFvDRIOos19eG8msyiDFTJuc0PE",
  authDomain: "tilla-erp-8b357.firebaseapp.com",
  projectId: "tilla-erp-8b357",
  storageBucket: "tilla-erp-8b357.firebasestorage.app",

// hisob.js va POS kodi shularni so'raydi
var data = { zavodlar: [], klientlar: [], lomlar: [], kassa: {} };
var _aktivKat = 'A';
var _cloudDb = null, _cloudUser = null;

// POS holat o'zgaruvchilari — index.html dagi bilan AYNI
var _posQ = '', _posKi = -1;
var _pbMode = 'berish';
var _pbSavat = [], _pbZi = -1, _pbTi = 0, _pbIch = [], _pbKir = '', _pbNeg = false;
// v0.09 (Ibrohim): «berishning tepasiga kurs turishi kere — nobodo kurs
// o'zgarib qolsa, Tilla ERP dan qilib bo'lmasa, o'zi qo'lda o'zgartirolsin».
// Qo'lda yozilgani HECH QAYERGA saqlanmaydi — cloudga ham, xotiraga ham.
// Qayta kirilganda yoki boshqa odam kirganda kursOqi() ERP dagisini qaytaradi.
var _kursQolda = false, _pbKursTahrir = false;
// v0.10 (Ibrohim): «keyin tepada A B» — narx qaysi kategoriyadan
// hisoblanishini kassir tanlaydi. Bo'sh bo'lsa klientning o'z kategoriyasi
// (k.kat) ishlatiladi. FAQAT SHU BERISH uchun — klient yozuviga tegmaydi
// (index.html:11776 dagi qoida bilan bir xil).
var _pbKat = '';
var _pbQarzKesh = null;
var _posLockN = 0, _posLockY = 0;

// ── index.html dagi yordamchilarning POS uchun kichik variantlari ──
function getRol(){ return 'pos'; }
function cloudKol(){ return SANDBOX + '_tilla_' + (_cloudUser ? _cloudUser.uid : 'x'); }
function cloudXato(e){ if (window.console) console.error('cloud:', e); }
function _verBelgi(){ return POS_VER; }

// v0.13 (Ibrohim): «lom hardoim kursdan -2 $».
// Tilla ERP da lom alohida saqlanadi (`tilla-lom-bugun`) va o'zgaruvchan
// farq bilan hisoblanadi. POS da bu YO'Q — qoida bitta va qat'iy.
// Cloudda kelgan `tilla-lom-bugun` POS da ISHLATILMAYDI, unga YOZILMAYDI ham.
var POS_LOM_FARQ = 2;
function _posLom(){
  var k = parseNum(localStorage.getItem('tilla-kurs-bugun')||0);
  if(!k) return 0;
  var l = Math.round((k - POS_LOM_FARQ)*10)/10;
  return l > 0 ? l : 0;
}
function sozManba(vaqtBilan){
  try{
    var m = localStorage.getItem('tilla-soz-manba') || '';
    return m || '';
  }catch(e){ return ''; }
}
function _posChRef(){
  try{ if(_cloudDb && _cloudUser)
    return _cloudDb.collection(cloudKol()).doc('_poschernovik').collection('items'); }catch(e){}
  return null;
}
var _cxT = null;
function _chekXabar(matn, tur){
  var e = document.getElementById('chek-xabar');
  if(!e) return;
  e.textContent = matn;
  e.className = tur || '';
  e.style.display = 'block';
  clearTimeout(_cxT);
  _cxT = setTimeout(function(){ e.style.display = 'none'; }, 2600);
}

// ═════ KIRISH ═════
function $(id){ return document.getElementById(id); }
var _holatRang='', _holatMatn='ulanmoqda';
function holat(t, m){
  _holatRang = t || ''; _holatMatn = m || '';
  var d = $('ph-d'), x = $('ph-t');
  if(d) d.className = 'd' + (t ? ' ' + t : '');
  if(x) x.textContent = m;
  _cloudIkonUpd();
}
// v0.21: ERP dagi cloudStatus (index.html:19761) bilan bir xil ranglar.
function _cloudIkonUpd(){
  var ik = document.getElementById('pos-cloud-ikon');
  var w  = document.getElementById('pos-cloud');
  if(w) w.title = 'Cloud: ' + _holatMatn;
  if(!ik) return;
  var yashil = _holatRang === 'ok';
  var c = yashil ? 'var(--green)'
        : _holatRang === 'wait' ? 'var(--gold)'
        : _holatRang === 'no'   ? 'var(--red)' : 'var(--muted)';
  ik.style.stroke = c;
  ik.style.fill = yashil ? c : 'none';
  ik.style.fillOpacity = yashil ? '0.25' : '0';
}
// Telefonda tooltip yo'q — bosilsa matn xabar bo'lib chiqadi.
// v0.23 (Ibrohim): «clouddi bossa qaysi login bilan kirganini ko'rsatsin».
// ⚠ PAROL KO'RSATILMAYDI — brauzerda ochiq turgan parol xavfli.
function posCloudYop(){ var m=document.getElementById('pos-cl-ovl'); if(m) m.remove(); }
function posCloudBos(){
  posCloudYop();
  var pochta = '';
  try{ pochta = (_cloudUser && _cloudUser.email) || ''; }catch(e){}
  var xona = (typeof SANDBOX!=='undefined' && SANDBOX) ? SANDBOX : '—';
  var manba = _nusxadan ? 'POS nusxasi (tez)' : 'butun baza';
  var vaqt = '—';
  try{ if(_holatVaqt) vaqt = new Date(_holatVaqt).toLocaleString('ru-RU'); }catch(e){}
  var rang = _holatRang==='ok' ? 'green' : _holatRang==='no' ? 'red' : 'gold';
  var qator = function(k, v, c){
    return '<div style="display:flex;justify-content:space-between;align-items:baseline;'
      + 'gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:13px;">'
      + '<span style="color:var(--muted);flex:none;">'+k+'</span>'
      + '<b style="text-align:right;min-width:0;overflow-wrap:anywhere;'
      + (c?'color:var(--'+c+');':'')+'">'+_posEsc(v)+'</b></div>';
  };
  var h='<div id="pos-cl-ovl" onclick="if(event.target===this)posCloudYop()" '
    + 'style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;'
    + 'align-items:center;justify-content:center;padding:20px;z-index:9300;">';
  h+='<div style="width:100%;max-width:420px;background:var(--surf);border:1px solid var(--border);border-radius:16px;overflow:hidden;">';
  h+='<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">';
  h+='<span style="font-size:16px;font-weight:700;color:var(--'+rang+');">Cloud</span>';
  h+='<span style="flex:1;"></span>';
  h+='<button onclick="posCloudYop()" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surf2);color:var(--muted);cursor:pointer;font-size:14px;">&#10005;</button></div>';
  h+='<div style="padding:4px 16px 15px;">';
  h+=qator('POS login', _posLogin || '—');
  h+=qator('Cloud pochta', pochta || 'ulanmagan', pochta?'':'red');
  h+=qator('Xona', xona);
  h+=qator('Holat', _holatMatn || '—', rang);
  h+=qator('Ma&#39;lumot', manba);
  h+=qator('Oxirgi yangilanish', vaqt);
  h+='<div style="margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.6;">'
    + 'Parol ko&#39;rsatilmaydi. Cloud pochtasi Tilla ERP bilan bir xil — '
    + 'bir brauzerda bir marta kiritiladi.</div>';
  h+='</div></div></div>';
  var d=document.createElement('div'); d.innerHTML=h;
  document.body.appendChild(d.firstChild);
}
function xato(m){ $('ke').textContent = m || ''; }
var _kirdi = false, _posLogin = '';

$('kb').addEventListener('click', function(){
  var u = $('ku').value.trim().toLowerCase(), p = $('kp').value;
  if(!CREDS.filter(function(c){ return c.login===u && c.parol===p; })[0]){
    xato('Login yoki parol notogri'); return;
  }
  xato(''); _kirdi = true; _posLogin = u;   // v0.23: bulut oynasida ko'rsatiladi
  try{ localStorage.setItem('pos-kirdi','1'); }catch(e){}
  fbBoshla();
});
$('kp').addEventListener('keydown', function(e){ if(e.key==='Enter') $('kb').click(); });

function fbBoshla(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB);
    _cloudDb = firebase.firestore();
  }catch(e){ xato('Firebase ishga tushmadi'); return; }
  firebase.auth().onAuthStateChanged(function(u){
    if(!_kirdi) return;
    if(u){
      _cloudUser = u;
      $('kirish').style.display = 'none';
      holat('wait','yuklanmoqda');
      yukla();
    } else {
      $('k1').hidden = true; $('k2').hidden = false;
      $('k-t').textContent = 'Cloud hisobi';
      $('kn').innerHTML = 'Tilla ERP dagi bulut ikonkasida yozilgan pochta.<br>Bir marta kiritiladi.';
      xato(''); setTimeout(function(){ $('fe').focus(); }, 60);
    }
  });
}
// v0.22 (Ibrohim planshetdan): «pochta yoki parol notori» — sababi
// ko'rinmasdi. Endi Firebase xato kodi odam tiliga o'giriladi va URINILGAN
// POCHTA ko'rsatiladi — planshet klaviaturasi buzib yuborganini ko'rasiz.
$('fb').addEventListener('click', function(){
  var em = $('fe').value.trim().toLowerCase(), pa = $('fp').value;
  if(!em || !pa){ xato('Pochta va parolni kiriting'); return; }
  var b = $('fb'); b.disabled = true; b.textContent = '...';
  firebase.auth().signInWithEmailAndPassword(em, pa)
    .then(function(){ b.disabled=false; b.textContent='Cloudga ulanish'; xato(''); })
    .catch(function(e){
      b.disabled=false; b.textContent='Cloudga ulanish';
      var k = (e && e.code) || '';
      var m;
      if(k==='auth/network-request-failed')      m='Internet yo\'q';
      else if(k==='auth/too-many-requests')      m='Juda ko\'p urinish — biroz kuting';
      else if(k==='auth/invalid-email')          m='Pochta shakli noto\'g\'ri';
      else if(k==='auth/user-not-found')         m='Bunday pochta yo\'q';
      else if(k==='auth/wrong-password')         m='Parol noto\'g\'ri (pochta to\'g\'ri)';
      else if(k==='auth/invalid-credential')     m='Pochta yoki parol noto\'g\'ri';
      else                                      m='Kirmadi ('+(k||'sabab noma\'lum')+')';
      xato(m + ' — ' + em);   // urinilgan pochta ko'rsatiladi
    });
});
$('fp').addEventListener('keydown', function(e){ if(e.key==='Enter') $('fb').click(); });

// ═════ CLOUDDAN O'QISH ═════
// v0.03 (Ibrohim: «POS kurssi ko'rsatmayapti»).
// Kurs zavodlar bilan birga emas — cloudda o'z hujjatida turadi (`sozlamalar`).
// Tilla ERP uni o'qib brauzer xotirasiga yozadi, POS kodi esa xotiradan oladi.
// pos.html o'sha hujjatni o'qimasdi — zanjirning bitta halqasi yo'q edi va
// kurs «—» bo'lib turardi. Endi ochilganda bir marta o'qiladi.
// POS kurs kodiga TEGILMADI — u avvalgidek xotiradan oladi.
// FAQAT O'QIYDI: kassir kursni o'zgartirmaydi (Ibrohim qoidasi).
function kursOqi(){
  return _cloudDb.collection(cloudKol()).doc('sozlamalar').get().then(function(d){
    if(!d.exists) return;
    var k = (d.data() || {}).k || {};
    // Qo'lda yozilgan kurs BEKOR bo'ladi — haqiqat manbai Tilla ERP.
    _kursQolda = false;
    if(!('tilla-kurs-bugun' in k)){
      try{ localStorage.removeItem('tilla-kurs-bugun'); }catch(e){}
    }
    Object.keys(k).forEach(function(key){
      try{ localStorage.setItem(key, k[key]); }catch(e){}
    });
  }).catch(function(e){ cloudXato(e); });   // kurs kelmasa ham ro'yxat chiziladi
}

// v0.19 (Ibrohim): «ERP da o'zgaradi, POS da o'zgaradi».
// `holat` hujjati kichkina — {vaqt, qurilma, bolak, hajm}. Uni tinglash arzon.
// ⚠ CLOUDGA HECH NIMA YOZILMAYDI. Oplog, chernovik, sozlamalar, dona bazasi
//   — hech biriga tegilmaydi. POS faqat O'QIYDI.
var _holatUnsub=null, _holatVaqt=0, _yangiKut=null, _yangiMeta=null;

// Bo'laklarni o'qib `data` ga qo'llash — birinchi yuklashda ham, yangilanishda ham.
// v0.20: bo'laklarni birlashtirib qaytaradi (pos_nusxa_bN yoki holat_bN).
function _oqiBolak(pref, n){
  var oq = [];
  for(var i=0;i<n;i++) oq.push(_cloudDb.collection(cloudKol()).doc(pref+i).get());
  return Promise.all(oq).then(function(docs){
    var j = '';
    for(var i=0;i<docs.length;i++){
      if(!docs[i].exists) throw new Error(pref+i+' yo\'q');
      j += docs[i].data().j;
    }
    return j;
  });
}

// v0.20 (Ibrohim: «nega sekin judayam»): avval KICHIK NUSXANI sinaymiz.
// Tilla ERP uni har saqlashda yozadi — ichida faqat qarz va ostatka hisobiga
// kerak bo'lgan maydonlar bor (kassa, lom, dona registri yo'q).
// Nusxa yo'q bo'lsa yoki `holat` dan ESKI bo'lsa — eski yo'lga qaytamiz.
// Ya'ni noto'g'ri raqam ko'rsatilmaydi, faqat sekinroq bo'ladi.
var _nusxadan = false;
function _bolakOqi(meta){
  var ref = _cloudDb.collection(cloudKol());
  return ref.doc('pos_nusxa').get().then(function(pd){
    var pm = pd.exists ? (pd.data()||{}) : null;
    if(pm && pm.bolak && (pm.vaqt||0) >= (meta.vaqt||0)){
      _nusxadan = true;
      return _oqiBolak('pos_nusxa_b', pm.bolak);
    }
    _nusxadan = false;
    return _oqiBolak('holat_b', meta.bolak||1);
  }).catch(function(){
    _nusxadan = false;                       // nusxa o'qilmadi — to'liq bazaga qaytamiz
    return _oqiBolak('holat_b', meta.bolak||1);
  }).then(function(j){
    data = JSON.parse(j);
    if(!data.zavodlar) data.zavodlar = [];
    if(!data.klientlar) data.klientlar = [];
    if(typeof turOstKeshTozala === 'function') turOstKeshTozala();
    return kursOqi();
  });
}
function _sinxronMatn(){ return _nusxadan ? 'sinxron' : 'sinxron · to\'liq'; }

function yukla(){
  _cloudDb.collection(cloudKol()).doc('holat').get().then(function(d){
    if(!d.exists){ holat('no','baza bo\'sh'); renderPOS(); return; }
    var meta = d.data() || {};
    _holatVaqt = meta.vaqt || 0;
    return _bolakOqi(meta).then(function(){
      holat('ok',_sinxronMatn());
      renderPOS();
      holatTingla();
    });
  }).catch(function(e){ holat('no','o\'qilmadi'); cloudXato(e); });
}

function holatTingla(){
  if(_holatUnsub) return;
  try{
    _holatUnsub = _cloudDb.collection(cloudKol()).doc('holat').onSnapshot(function(d){
      if(!d.exists) return;
      var meta = d.data() || {};
      if(!meta.vaqt || meta.vaqt === _holatVaqt) return;   // o'zgarmagan
      _yangiMeta = meta;
      // 1.5 soniya kutamiz — ERP ketma-ket saqlasa bitta o'qish bo'ladi
      if(_yangiKut) clearTimeout(_yangiKut);
      _yangiKut = setTimeout(_yangila, 1500);
    }, function(e){ cloudXato(e); });
  }catch(e){}
}

function _yangila(){
  _yangiKut = null;
  var meta = _yangiMeta;
  if(!meta || !_cloudDb) return;
  // ⚠ BERISH/VOZVRAT oynasi ochiq bo'lsa TEGMAYMIZ: savat zavod INDEKSIGA
  // tayanadi (_pbSavat[i].zi). Baza almashsa indeks boshqa zavodga tushib
  // qolishi mumkin. Oyna yopilganda posBYop qayta chaqiradi.
  if(document.getElementById('pb-ovl')) return;
  _yangiMeta = null;
  _holatVaqt = meta.vaqt;
  // Klient oynasi ochiq bo'lsa — NOM bo'yicha eslab qolamiz, indeks bo'yicha
  // emas. Klient o'chirilgan bo'lsa indeks boshqa odamga ko'chib ketardi.
  var ochiqNom = null;
  if(document.getElementById('pos-ovl') && _posKi>=0 && data.klientlar[_posKi]){
    ochiqNom = data.klientlar[_posKi].nom;
  }
  var kursOchiq = !!document.getElementById('pos-kurs-ovl');
  holat('wait','yangilanmoqda');
  _bolakOqi(meta).then(function(){
    holat('ok',_sinxronMatn());
    renderPOS();
    if(ochiqNom){
      var yi = -1;
      (data.klientlar||[]).forEach(function(k,i){ if(k && k.nom===ochiqNom) yi=i; });
      if(yi>=0){ _posKi = yi; _posModal(); }
      else posModalYop();          // klient o'chirilgan — oyna yopiladi
    }
    if(kursOchiq) posKursOch();
  }).catch(function(e){ holat('no','o\'qilmadi'); cloudXato(e); });
}

function _posEsc(x){ return String(x==null?'':x)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _posQarz(k){
  try{ return klientJamiQarz(k)||0; } catch(e){ return 0; }
}

function posQidir(v){ _posQ=v; _posRoyxat(); }

function posSakra(h){
  var el=document.getElementById('pos-h-'+h);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

function posKlientOch(ki){ _posKi=ki; _posModal(); }

function posModalYop(){
  var m=document.getElementById('pos-ovl');
  if(!m) return;                     // ochilmagan bo'lsa qulfga TEGILMAYDI
  m.remove();
  _posScrollLock(false);
}

  if(a==='berish'){ posBerishOch(); return; }    // POS 1.08

  var nomlar={berish:'BERISH',vozvrat:'VOZVRAT',tolov:"TO'LOV",sotuv:'SOTUV'};
  alert(nomlar[a]+' - keyingi bosqichda yoziladi (POS 1.02).');

// (Ibrohim: «tilla erpdigi kirim narximas, A B kategoriya narxini ko'rsatsa bo'ldi»).

var _POSG = 'display:grid;grid-template-columns:1fr 84px 84px;align-items:center;gap:6px;';

function _posNarxlar(zi, ti){
  var eski = _aktivKat, a='', b='';
  try{
    _aktivKat='A'; a = getKatNarx(zi, ti, -1);
    _aktivKat='B'; b = getKatNarx(zi, ti, -1);
  } catch(e){}
  _aktivKat = eski;
  return {a:a, b:b};
}

  var k=parseNum(localStorage.getItem('tilla-kurs-bugun')||0);

}

function _posRoyxat(){
  var lst=document.getElementById('pos-list');
  if(!lst) return;
  var q=(_posQ||'').toLowerCase().trim();
  var hamma=(data.klientlar||[]).map(function(k,i){ return {k:k,i:i}; })
    .filter(function(o){ return o.k && o.k.nom; });
  hamma.sort(function(a,b){ return String(a.k.nom).localeCompare(String(b.k.nom),'uz'); });
  var ro=hamma.filter(function(o){ return !q || String(o.k.nom).toLowerCase().indexOf(q)>=0; });

  if(!ro.length){
    lst.innerHTML='<div style="text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;">'
      +(q?'Bunday klient yo\'q':'Klient ro\'yxati bo\'sh')+'</div>';
  } else {
    var out='', oxHarf='';
    ro.forEach(function(o){
      var k=o.k, hf=_posBosh(k.nom);
      if(hf!==oxHarf){
        out+='<div id="pos-h-'+_posEsc(hf)+'" style="font-size:11px;letter-spacing:.12em;color:var(--muted);padding:13px 4px 5px;font-weight:700;">'+_posEsc(hf)+'</div>';
        oxHarf=hf;
      }
      var qz=_posQarz(k);
      var rang = qz>0.001?'var(--red)':(qz<-0.001?'var(--green)':'var(--muted)');
      var yorliq = qz>0.001?'KLIENT QARZI':(qz<-0.001?'BIZ QARZDORMIZ':"QARZ YO'Q");
      var belgi = qz>0.001?'\u2212':(qz<-0.001?'+':'');   // ilovadagi qoida: klient qarzi MINUS
      out+='<div onclick="posKlientOch('+o.i+')" style="display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:999px;background:var(--surf);border:1px solid var(--border);margin-bottom:5px;cursor:pointer;">';
      out+='<div style="width:52px;height:52px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surf);border:1px solid var(--border);color:var(--gold);font-weight:600;font-size:20px;">'+_posEsc(hf)+'</div>';
      out+='<div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+_posEsc(k.nom)+'</div></div>';
      out+='<div style="text-align:right;flex:none;"><div style="font-size:15px;font-weight:700;color:'+rang+';font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums;">'+belgi+fmtG(Math.abs(qz))+'g</div>';
      out+='<div style="font-size:9px;color:var(--muted);letter-spacing:.04em;">'+yorliq+'</div></div>';
      out+='</div>';
    });
    lst.innerHTML=out;
  }
}

  });

}

function _posModal(){
  posModalYop();
  var k=data.klientlar[_posKi]; if(!k){ return; }
  // POS 1.04: qarz bloki klient ekranining (openKlientDetail 11780) AYNAN nusxasi.
  // Ibrohim: «klientga bosib kirganda qarzdorligini shunaqa ko'rsatsin».
  // Hisob qayta yozilmadi — _qarzTarkib (17057) va _qarzJamiRows (16980) chaqiriladi.
  var _t=null, rows=[], jr={ostatka:0,bizQarz:0};

function _posScrollLock(on){

      b.style.setProperty('position','fixed','important');
      b.style.setProperty('top',(-_posLockY)+'px','important');
      b.style.setProperty('left','0','important');
      b.style.setProperty('right','0','important');
      b.style.setProperty('width','100%','important');
      b.style.setProperty('overflow','hidden','important');
    }
    _posLockN++;
  } else {
    _posLockN = Math.max(0, _posLockN-1);
    if(_posLockN===0){

function _pbSIdx(i){ for(var x=0;x<_pbSavat.length;x++) if(_pbSavat[x].zi===i) return x; return -1; }

function _pbIchJami(){ var g=0; _pbIch.forEach(function(d){ g+=d.g; }); return roundG(g); }

function _pbTurJami(j){ var g=0; _pbIch.forEach(function(d){ if(d.ti===j) g+=d.g; }); return roundG(g); }

function _pbSavatJami(){ var g=0,n=0;
  _pbSavat.forEach(function(s){ s.dona.forEach(function(d){ g+=d.g; n++; }); });
  return {g:roundG(g), n:n}; }

function _pbZavodJami(i){ var x=_pbSIdx(i); if(x<0) return null;
  var g=0; _pbSavat[x].dona.forEach(function(d){ g+=d.g; });
  return {g:roundG(g), n:_pbSavat[x].dona.length}; }

function _pbTurlar(s){
  var m={}, tartib=[];
  s.dona.forEach(function(d){
    if(!m[d.ti]){ m[d.ti]={g:0,arr:[]}; tartib.push(d.ti); }
    m[d.ti].g+=d.g; m[d.ti].arr.push(d.g);
  });
  tartib.forEach(function(ti){ m[ti].g=roundG(m[ti].g); });
  return {tartib:tartib, m:m};
}

  var sana=today();

}

    if(V){
      var q=_pbQarz(z.nom,t.nom), ortiq=roundG(tg2-q);

      else if(ortiq>0.001) h+='<div style="'+IN+'border:1px solid var(--green-bd);background:var(--green-bg);color:var(--green);">Klient qarzi <b>'+fmtG(q)+' g</b> — qarzdan <b>'+fmtG(ortiq)+' g</b> oshdi, oshgani <b>biz qarzdor</b> bo\'ladi</div>';
      else h+='<div style="'+IN+'border:1px solid var(--border);background:var(--bg);color:var(--muted);">Klient qarzi <b>'+fmtG(q)+' g</b> · qaytdi <b>'+fmtG(tg2)+' g</b> · qoladi <b>'+fmtG(roundG(q-tg2))+' g</b></div>';
    } else {
      var o=_pbOst(_pbZi,_pbTi);
      if(tg2>o+0.001) h+='<div style="'+IN+'border:1px solid var(--red-bd);background:var(--red-bg);color:var(--red);">⚠ '+_posEsc(t.nom)+' omborda <b>'+fmtG(o)+' g</b> — <b>'+fmtG(roundG(tg2-o))+' g</b> oshib ketdi (to\'xtatmaydi)</div>';
      else h+='<div style="'+IN+'border:1px solid var(--border);background:var(--bg);color:var(--muted);">'+_posEsc(t.nom)+' omborda <b>'+fmtG(o)+' g</b>'+_pbNarxSatr(_pbZi,_pbTi)+'</div>';
    }
    h+='<div style="display:flex;gap:7px;flex:none;">';
    h+='<input id="pb-in" value="'+_posEsc(_pbKir)+'" oninput="posBKirSet(this.value)" onkeydown="if(event.key===\'Enter\')posBQoshDona()" inputmode="none" autocomplete="off" placeholder="'+_posEsc(t.nom)+' — gramm" style="flex:1;min-width:0;height:46px;border-radius:16px;padding:0 12px;font-size:16px;background:var(--bg);border:1px solid var(--'+C+'-bd);color:var(--text);outline:none;font-family:inherit;">';
    h+='<button onclick="posBNeg()" style="width:48px;flex:none;height:46px;border-radius:16px;cursor:pointer;font-size:19px;border:1px solid '+(_pbNeg?'var(--red-bd)':'var(--border)')+';background:'+(_pbNeg?'var(--red-bg)':'var(--surf2)')+';color:'+(_pbNeg?'var(--red)':'var(--text)')+';">'+(_pbNeg?'−':'±')+'</button>';
    h+='<button onclick="posBQoshDona()" style="width:48px;flex:none;height:46px;border-radius:16px;border:0;background:var(--'+C+');color:var(--on-gold);font-size:19px;cursor:pointer;">+</button></div>';
    if(_pbNeg) h+='<div style="font-size:11px;color:var(--red);padding:0 2px;flex:none;">keyingi qo\'shilgan gramm MINUS bo\'lib tushadi</div>';
    // POS 1.20 (Ibrohim): «gorizontal holatda yonida chiqsin, nega chiqmidi?»
    // POS 1.11 da past ekranda klaviatura YASHIRILARDI (5 qator 276px joy
    // so'rardi, modal esa 340px). Endi yashirilmaydi — past ekranda 5 USTUNGA
    // o'tadi va 3 qatorga sig'adi:  7 8 9 ⌫ C / 4 5 6 . 0 / 1 2 3 [Qo'shish]
    var KUST = PAST ? 5 : 3;

// ═════ CHAP CHETDAN O'NGGA SURISH = ORQAGA (v0.06) ═════
// Ibrohim: «chapdan o'nga swipe qisa back bo'sin... chap ekrandan back bo'ladi».
// Telefonning o'z orqaga imo-ishorasidek: barmoq ekranning CHAP CHETIDAN
// boshlanib o'ngga suriladi. O'rtadan surish hech nima qilmaydi.
var _SW_CHET = 28;   // chap chetning kengligi, px — shundan boshlansagina hisobga olinadi
var _SW_YOL  = 70;   // orqaga sanalishi uchun kamida shuncha px o'ngga surilsin
var _SW_TIK  = 60;   // tik siljish shundan oshsa — bu scroll, orqaga emas
var _swX = -1, _swY = 0, _swBek = false;

// Eng ustki ochiq qatlamni yopadi. Tartib z-index bo'yicha:
// pb-ovl (9200) → pos-kurs-ovl (9100) → pos-ovl (9000).
// Mavjud tugmalarning funksiyasi chaqiriladi — ular qanday so'rasa, shunday
// so'raydi (savat to'la bo'lsa tasdiq so'raladi, ma'lumot bekorga o'chmaydi).
function posOrqa(){
  if(document.getElementById('pb-ovl')){
    if(_pbZi >= 0) posBChiq();   // zavod ichida — zavod ro'yxatiga qaytadi
    else posBBekor();            // zavod ro'yxatida — berishdan chiqadi
    return true;
  }
  if(document.getElementById('pos-kurs-ovl')){ posKursYop(); return true; }
  if(document.getElementById('pos-ovl')){ posModalYop(); return true; }
  return false;                  // bosh ro'yxatda orqaga yo'q
}

// Barmoq gorizontal siljiydigan qatorda boshlangan bo'lsa (zavod tugmalari,
// pos.html:854) va o'sha qator o'ngga surilgan bo'lsa — avval qator qaytsin.
function _swBloklandi(el){
  for(var n=0; n<8 && el && el.nodeType===1; n++, el=el.parentElement){
    if(el.scrollWidth > el.clientWidth + 4 && el.scrollLeft > 0) return true;
  }
  return false;
}

document.addEventListener('touchstart', function(e){
  if(e.touches.length !== 1){ _swX = -1; return; }
  var t = e.touches[0];
  if(t.clientX > _SW_CHET){ _swX = -1; return; }
  _swX = t.clientX; _swY = t.clientY;
  _swBek = _swBloklandi(e.target);
}, {passive:true});

document.addEventListener('touchend', function(e){
  if(_swX < 0) return;
  var x0 = _swX; _swX = -1;
  if(_swBek) return;
  var t = e.changedTouches && e.changedTouches[0]; if(!t) return;
  var dx = t.clientX - x0, dy = Math.abs(t.clientY - _swY);
  if(dx >= _SW_YOL && dy <= _SW_TIK && dx > dy) posOrqa();
}, {passive:true});

// ═════ BOSHLANISH ═════
try{
  if(localStorage.getItem('pos-kirdi') === '1'){ _kirdi = true; fbBoshla(); }
  else setTimeout(function(){ $('ku').focus(); }, 80);
}catch(e){}

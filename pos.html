<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}

/* POS 1.16 — POS palitrasi (Ibrohim tanlagan: #030F2C / #5183FF / #5F84DF / #93B2FF).
   FAQAT POS konteynerlari ichida amal qiladi. */
/* POS 1.29 — YORUG' fon (Ibrohim: «fon oq bo'lsin», faqat POS).
   Ranglar oq ustida o'qilishi uchun to'q ko'kdagilardan farq qiladi:
   urg'u #5183FF -> #3B6FE0, qarz #FF8B6B -> #D14A2E (kontrast 2.1 -> 4.4). */
body.rol-pos, #main-pos, #pos-ovl, #pb-ovl{
  --bg:#EEF1F7; --surf:#FFFFFF; --surf2:#F4F6FB; --border:#D8DEEA;
  --text:#0F1B33; --muted:#6B7894;
  --gold:#3B6FE0; --gold2:#3B6FE0;
  --gold-bg:rgba(59,111,224,.10); --gold-bd:#C3CFE8; --on-gold:#FFFFFF;
  --yellow:#3B6FE0; --yellow-bg:rgba(59,111,224,.10);
  --red:#D14A2E; --red-bg:rgba(209,74,46,.10); --red-bd:rgba(209,74,46,.34);
  --green:#1E8F62; --green-bg:rgba(30,143,98,.10); --green-bd:rgba(30,143,98,.34);
  --teal:#2E7D8F; --teal-bg:rgba(46,125,143,.10); --teal-bd:#C3CFE8;
  --blue:#3B6FE0; --blue-bg:rgba(59,111,224,.10); --blue-bd:#C3CFE8;
  color:var(--text);
}
/* POS 1.21: o'ng pastdagi versiya belgisi ham POS palitrasida */
/* POS 1.32 (Ibrohim: «pasdan versiyaniyam obtasha») — POS da pastdagi
   versiya belgisi ko'rinmaydi; u tepada «TILLA POS 1.32» bo'lib turibdi. */
body.rol-pos #app-ver{ display:none !important; }
/* POS 1.29 (Ibrohim: «iOS dizayn, rangiga emas formasiga») — tugma va maydonlar
   TO'LIQ PILL. !important kerak: POS kodi inline style bilan chiziladi. */
body.rol-pos button, body.rol-pos input,
#pos-ovl button, #pos-ovl input,
#pb-ovl button, #pb-ovl input,
#pos-bell-ovl button, #pos-bell-ovl input{ border-radius:999px !important; }
/* POS 1.21: klient oynasi sarlavhasi — tor ekranda amal pillari o'z qatoriga
   tushadi (avval avatar/ism bilan bir qatorda siqilib qolardi). */
#pos-ovl .pos-hd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
#pos-ovl .pos-pills{display:flex;gap:5px;flex:none;}
@media(max-width:700px){
  #pos-ovl .pos-pills{order:3;flex:1 1 100%;}
  #pos-ovl .pos-pills button{flex:1;justify-content:center;padding-left:8px;padding-right:8px;}
}

/* pos.html qobig'i — index.html dagi topbar/tablar o'rniga */
/* v0.04: safe-top QO'SHILMAYDI — renderPOS ning o'z sarlavhasi uni qo'yadi
   (padding:var(--safe-top) 2px 11px). Ikki marta qo'shilganda kontent pastga
   surilib, ro'yxatning oxiri kesilib qolardi. */
#main-pos{display:flex!important;flex-direction:column;height:100%;min-width:0;overflow-y:auto;padding:0 10px calc(10px + var(--safe-bot));}
#kirish{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
#kirish .box{width:100%;max-width:340px}
#kirish .brand{text-align:center;margin-bottom:24px}
#kirish .brand b{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
#kirish .brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
#kirish .card{background:var(--surf);border:1px solid var(--border);border-radius:22px;padding:20px}
#kirish .t{font-size:13px;font-weight:700;margin-bottom:13px}
#kirish input{width:100%;padding:13px 16px;border:1.5px solid var(--border);background:var(--surf2);margin-bottom:9px;outline:none}
#kirish input:focus{border-color:var(--gold);background:var(--surf)}
#kirish .go{width:100%;padding:13px;background:var(--gold);color:var(--on-gold);font-weight:700;margin-top:3px}
#kirish .go:disabled{opacity:.5}
#kirish .err{color:var(--red);font-size:12.5px;min-height:18px;text-align:center;margin-top:7px}
#kirish .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
#kirish .xona{display:inline-block;background:var(--red-bg);color:var(--red);padding:3px 11px;font-size:10.5px;font-weight:800;letter-spacing:.08em;margin-bottom:12px;border-radius:999px}
/* v0.04: avval yuqori o'ngda edi — renderPOS ning KURS pilli AYNI o'sha joyda,
   ustma-ust tushardi. Endi pastki chap burchakda. */
#pos-holat{position:fixed;bottom:calc(8px + var(--safe-bot));left:10px;z-index:9500;opacity:.92;display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--muted);font-weight:600}
#pos-holat .d{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#pos-holat .d.ok{background:var(--green)}#pos-holat .d.no{background:var(--red)}#pos-holat .d.wait{background:var(--gold)}
#chek-xabar{position:fixed;left:50%;top:calc(12px + var(--safe-top));transform:translateX(-50%);z-index:9600;background:var(--surf);border:1px solid var(--border);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.16);display:none}
#chek-xabar.ok{border-color:var(--green-bd);color:var(--green)}
#chek-xabar.xato{border-color:var(--red-bd);color:var(--red)}
</style>

<script>
// ════════════════════════════════════════════════════════════
// TILLA POS — v0.02
//
// Ibrohim (2026-09-09): «manga yangi Amerika ochma» — POS ekranlari
// index.html dan O'ZGARTIRILMASDAN ko'chirildi. Yangi dizayn yasalmadi.
// 51 funksiya, CSS palitrasi va element id lari — hammasi AYNI o'sha.
//

//   • SINOV XONASI QOTIRILGAN — `SANDBOX` o'zgarmas.
//   • Cloudga YOZADIGAN yagona joy: `posBSaqla` → `_poschernovik` (chernovik).
//     `holat`, `holat_bN`, `_amallar` ga YOZILMAYDI — hisobga tegmaydi.
//   • `index.html` va `hisob.js` ga tegilmagan.
// ════════════════════════════════════════════════════════════

var POS_VER = 'v0.04';

// ── SINOV XONASI — QOTIRILGAN ────────────────────
var SANDBOX = 'TEST';
// ───────────────────────────────────────────

var CREDS = [{ login:'test', parol:'test123' }];
var FB = {
  apiKey: "AIzaSyAfZ45TmFvDRIOos19eG8msyiDFTJuc0PE",
  authDomain: "tilla-erp-8b357.firebaseapp.com",
  projectId: "tilla-erp-8b357",
  storageBucket: "tilla-erp-8b357.firebasestorage.app",
  messagingSenderId: "876933095476",
  appId: "1:876933095476:web:a9fbf2c66fb496be0baa61"
};

// hisob.js va POS kodi shularni so'raydi
var data = { zavodlar: [], klientlar: [], lomlar: [], kassa: {} };
var _aktivKat = 'A';
var _cloudDb = null, _cloudUser = null;

// POS holat o'zgaruvchilari — index.html dagi bilan AYNI
var _posQ = '', _posKi = -1;
var _pbMode = 'berish';
var _pbSavat = [], _pbZi = -1, _pbTi = 0, _pbIch = [], _pbKir = '', _pbNeg = false;
var _pbQarzKesh = null;
var _posLockN = 0, _posLockY = 0;

// ── index.html dagi yordamchilarning POS uchun kichik variantlari ──
function getRol(){ return 'pos'; }
function cloudKol(){ return SANDBOX + '_tilla_' + (_cloudUser ? _cloudUser.uid : 'x'); }
function cloudXato(e){ if (window.console) console.error('cloud:', e); }

}

function $(id){ return document.getElementById(id); }
function holat(t, m){
  var d = $('ph-d'), x = $('ph-t');
  if(d) d.className = 'd' + (t ? ' ' + t : '');

function xato(m){ $('ke').textContent = m || ''; }
var _kirdi = false;

$('kb').addEventListener('click', function(){
  var u = $('ku').value.trim().toLowerCase(), p = $('kp').value;
  if(!CREDS.filter(function(c){ return c.login===u && c.parol===p; })[0]){
    xato('Login yoki parol notogri'); return;

  xato(''); _kirdi = true;
  try{ localStorage.setItem('pos-kirdi','1'); }catch(e){}

});
$('kp').addEventListener('keydown', function(e){ if(e.key==='Enter') $('kb').click(); });

function fbBoshla(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB);
    _cloudDb = firebase.firestore();
  }catch(e){ xato('Firebase ishga tushmadi'); return; }
  firebase.auth().onAuthStateChanged(function(u){
    if(!_kirdi) return;
    if(u){
      _cloudUser = u;
      $('kirish').style.display = 'none';
      holat('wait','yuklanmoqda');
      yukla();

    }
  });
}

});

// ═════ CLOUDDAN O'QISH ═════
// v0.03 (Ibrohim: «POS kurssi ko'rsatmayapti»).
// Kurs zavodlar bilan birga emas — cloudda o'z hujjatida turadi (`sozlamalar`).
// Tilla ERP uni o'qib brauzer xotirasiga yozadi, POS kodi esa xotiradan oladi.
// pos.html o'sha hujjatni o'qimasdi — zanjirning bitta halqasi yo'q edi va
// kurs «—» bo'lib turardi. Endi ochilganda bir marta o'qiladi.
// POS kurs kodiga TEGILMADI — u avvalgidek xotiradan oladi.
// FAQAT O'QIYDI: kassir kursni o'zgartirmaydi (Ibrohim qoidasi).
function kursOqi(){
  return _cloudDb.collection(cloudKol()).doc('sozlamalar').get().then(function(d){
    if(!d.exists) return;
    var k = (d.data() || {}).k || {};
    Object.keys(k).forEach(function(key){
      try{ localStorage.setItem(key, k[key]); }catch(e){}
    });
  }).catch(function(e){ cloudXato(e); });   // kurs kelmasa ham ro'yxat chiziladi
}

function yukla(){
  _cloudDb.collection(cloudKol()).doc('holat').get().then(function(d){
    if(!d.exists){ holat('no','baza bo\'sh'); renderPOS(); return; }
    var meta = d.data() || {}, n = meta.bolak || 1, oq = [];
    for(var i=0;i<n;i++) oq.push(_cloudDb.collection(cloudKol()).doc('holat_b'+i).get());
    return Promise.all(oq).then(function(docs){
      var j = '';
      for(var i=0;i<docs.length;i++){
        if(!docs[i].exists) throw new Error('bolak '+i+' yo\'q');
        j += docs[i].data().j;
      }
      data = JSON.parse(j);
      if(!data.zavodlar) data.zavodlar = [];
      if(!data.klientlar) data.klientlar = [];
      if(typeof turOstKeshTozala === 'function') turOstKeshTozala();
      return kursOqi().then(function(){
        holat('ok','sinxron');
        renderPOS();
      });
    });
  }).catch(function(e){ holat('no','o\'qilmadi'); cloudXato(e); });
}

function _posNarxlar(zi, ti){
  var eski = _aktivKat, a='', b='';
  try{
    _aktivKat='A'; a = getKatNarx(zi, ti, -1);
    _aktivKat='B'; b = getKatNarx(zi, ti, -1);
  } catch(e){}
  _aktivKat = eski;
  var z=''; try{ z = getZavodNarx(zi, ti); }catch(e){}
  return {z:z, a:a, b:b};
}

function posKursOch(){
  posKursYop();
  var kurs = parseNum(localStorage.getItem('tilla-kurs-bugun')||0);
  var lom  = parseNum(localStorage.getItem('tilla-lom-bugun')||0);
  var bUst = parseNum(localStorage.getItem('tilla-b-ust')||0);
  function qut(yorliq, qiymat, birlik, rang){
    return '<div style="flex:1;border-radius:12px;padding:11px 13px;border:1px solid '
      +(rang?'var(--gold-bd)':'var(--border)')+';background:'+(rang?'var(--yellow-bg)':'var(--surf2)')+';">'
      +'<div style="font-size:9.5px;letter-spacing:.09em;color:'+(rang?'var(--gold)':'var(--muted)')+';">'+yorliq+'</div>'
      +'<div style="font-size:24px;font-weight:700;color:'+(rang?'var(--gold)':'var(--text)')+';font-family:Roboto,sans-serif;">'
      +(qiymat?fmtD(qiymat):'\u2014')+'<span style="font-size:11px;color:var(--muted);font-weight:400;"> '+birlik+'</span></div></div>';
  }
  var h='<div id="pos-kurs-ovl" onclick="if(event.target===this)posKursYop()" style="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9100;">';
  h+='<div style="width:100%;max-width:580px;max-height:100%;overflow-y:auto;background:var(--surf);border:1px solid var(--border);border-radius:16px;">';
  h+='<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;">';
  h+='<span style="font-size:16px;font-weight:700;color:var(--gold);">Kunlik kurs</span>';
  h+='<span style="font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:2px 9px;">faqat ko\'rish</span>';
  h+='<span style="flex:1;"></span>';
  h+='<button onclick="posKursYop()" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surf2);color:var(--muted);cursor:pointer;font-size:14px;">&#10005;</button></div>';
  h+='<div style="padding:15px 16px;">';
  h+='<div style="display:flex;gap:10px;margin-bottom:11px;">'+qut('KURS',kurs,'$/g',1)+qut('LOM',lom,'$/g',0)+'</div>';
  var _mn=(typeof sozManba==='function')?sozManba(true):'';
  if(_mn) h+='<div style="font-size:11.5px;color:var(--muted);margin-bottom:11px;">Kursni qo\'ygan: <b style="color:var(--text);">'+_posEsc(_mn)+'</b></div>';
  h+='<div style="border-radius:12px;padding:10px 13px;border:1px solid var(--blue-bd);background:var(--blue-bg);margin-bottom:14px;">';
  h+='<div style="font-size:9.5px;letter-spacing:.09em;color:var(--blue);">B USTAMA \u2014 A NARX USTIGA QO\'SHILADI</div>';
  h+='<div style="font-size:20px;font-weight:700;color:var(--blue);font-family:Roboto,sans-serif;">+ '+fmtD(bUst)+'<span style="font-size:11px;color:var(--muted);font-weight:400;"> $/g</span></div></div>';
  if(!kurs){
    h+='<div style="padding:22px;text-align:center;color:var(--muted);font-size:13px;">Kunlik kurs kiritilmagan \u2014 narxlar hisoblanmaydi.</div>';
  } else {
    h+='<div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg);">';
    h+='<div style="'+_POSG+'padding:8px 13px;font-size:9.5px;letter-spacing:.09em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surf2);">';
    h+='<span>TUR</span><span style="text-align:right;">ZAVOD</span>';
    h+='<span style="text-align:right;">A</span><span style="text-align:right;">B</span></div>';
    (data.zavodlar||[]).forEach(function(z,zi){
      h+='<div style="padding:9px 13px 4px;font-size:12px;color:var(--gold);">'+_posEsc(z.nom)+'</div>';

function _posScrollLock(on){
  var b=document.body;
  if(on){
    if(_posLockN===0){
      _posLockY = window.pageYOffset || document.documentElement.scrollTop || 0;
      b.style.setProperty('position','fixed','important');
      b.style.setProperty('top',(-_posLockY)+'px','important');
      b.style.setProperty('left','0','important');
      b.style.setProperty('right','0','important');
      b.style.setProperty('width','100%','important');
      b.style.setProperty('overflow','hidden','important');
    }
    _posLockN++;
  } else {
    _posLockN = Math.max(0, _posLockN-1);
    if(_posLockN===0){
      ['position','top','left','right','width','overflow'].forEach(function(k){ b.style.removeProperty(k); });
      window.scrollTo(0,_posLockY);
    }
  }
}

function posBQoshDona(){
  var v=parseNum(_pbKir);
  if(!v){ var i=document.getElementById('pb-in'); if(i){ i.style.borderColor='var(--red)'; i.focus(); } return; }
  if(_pbNeg) v=-Math.abs(v);
  _pbIch.push({ti:_pbTi, g:roundG(v)}); _pbNeg=false; _pbKir=''; _pbDraw();
}

function posBIchOchir(i){ _pbIch.splice(i,1); _pbDraw(); }

function posBSavatga(){
  if(!_pbIch.length) return;
  var rec={zi:_pbZi, dona:_pbIch.map(function(d){ return {ti:d.ti,g:d.g}; })};
  var x=_pbSIdx(_pbZi);
  if(x>=0) _pbSavat[x]=rec; else _pbSavat.push(rec);
  _pbZi=-1; _pbIch=[]; _pbKir=''; _pbDraw();
}

function posBSavatOchir(i,ev){ if(ev) ev.stopPropagation(); _pbSavat.splice(i,1); _pbDraw(); }

function posBSavatKir(i){ posBZavod(_pbSavat[i].zi); }

function posBBekor(){
  if((_pbSavat.length||_pbIch.length) && !confirm('Hammasi o\'chadi. Bekor qilinsinmi?')) return;
  posBYop();
}

function ctr(s){ var p=Math.max(0,Math.floor((W-s.length)/2)); return Array(p+1).join(' ')+s; }

function rj(l,r){ var sp=W-l.length-r.length; if(sp<1)sp=1; return l+Array(sp+1).join(' ')+r; }

function posBSaqla(){
  if(!_pbSavat.length) return;
  var k=data.klientlar[_posKi]; if(!k) return;
  var ref=_posChRef();
  if(!ref){ alert('Cloud ulanmagan — chernovik yuborilmadi.\nInternetni tekshiring.'); return; }

  var sana=today();
  var _n=new Date();
  var soat=String(_n.getHours()).padStart(2,'0')+':'+String(_n.getMinutes()).padStart(2,'0');
  // POS 1.28 (Ibrohim: «chek chiqarish digan narsani unut») — chek BOSILMAYDI.
  // Chernovik hisobga tegmaydi, chek esa qabuldan keyin ma'noga ega bo'ladi.

  // Har zavod·tur uchun bitta qator. Donalarning ALOHIDA og'irliklari ham
  // yuboriladi — admin skan bilan solishtirishi uchun (k.tarix ularni saqlamaydi).
  var rows=[];
  _pbSavat.forEach(function(s){
    var z=data.zavodlar[s.zi]; if(!z) return;
    var agg=_pbTurlar(s);
    agg.tartib.forEach(function(ti){
      var t=z.turlar[ti]; if(!t) return;
      var g=agg.m[ti].g; if(!g) return;
      rows.push({zavod:z.nom, tur:t.nom, gramm:g,
                 dona:agg.m[ti].arr.length, donalar:agg.m[ti].arr.slice()});
    });
  });
  if(!rows.length){ alert('Qatorlar yo\'q.'); return; }

  ref.add({
    tip: _pbV()?'vozvrat':'berish',
    klient: k.nom,
    sana: sana, soat: soat,
    qurilma: (localStorage.getItem('tilla-qurilma')||''),
    rows: rows,
    holat: 'kutilmoqda',
    vaqt: Date.now()
  }).then(function(){
    _chekXabar('Tekshiruvga yuborildi','ok');
  }).catch(function(e){
    try{ cloudXato(e); }catch(_){}
    _chekXabar('Yuborilmadi — qayta urining','xato');
  });

  posBYop(); posModalYop();
  if(typeof renderPOS==='function') renderPOS();
}

function _pbDraw(){
  var box=document.getElementById('pb-box'); if(!box) return;
  var k=data.klientlar[_posKi]; if(!k) return;
  var V=_pbV(), C=V?'teal':'gold';
  // POS 1.11: telefon GORIZONTAL bo'lganda modal balandligi ~340px, klaviatura
  // esa 423px joy talab qiladi — sig'maydi va pastdan kesiladi. Past ekranda
  // klaviatura CHIQARILMAYDI, telefonning o'z raqamli klaviaturasi ishlatiladi
  // (maydonda inputmode="decimal"). Vertikal va planshetda hammasi avvalgidek.
  var PAST = window.innerHeight < 560;
  // POS 1.12: telefon VERTIKAL — eni ~390px, chap(296) + o'ng(286) sig'maydi
  // va o'ng ustun chetdan kesilardi (Ibrohim rasm bilan ko'rsatdi).
  // Tor ekranda ikki ustun BIR ustunga tushadi: tepada katakchalar, pastda
  // kiritish va klaviatura. Vertikalda balandlik yetarli, klaviatura qoladi.
  var TOR = window.innerWidth < 640;
  var z=_pbZi>=0?data.zavodlar[_pbZi]:null;
  var h='';

  // ── sarlavha
  h+='<div style="display:flex;align-items:center;gap:8px;padding:'+(PAST?'4px 9px':'9px 11px')+';border-bottom:1px solid var(--border);flex:none;">';
  h+='<button onclick="'+(z?'posBChiq()':'posBBekor()')+'" style="width:34px;height:34px;flex:none;border-radius:14px;border:1px solid var(--border);background:var(--surf2);color:var(--muted);cursor:pointer;font-size:15px;">&#8592;</button>';
  h+='<span style="font-size:14.5px;font-weight:700;white-space:nowrap;color:var(--'+C+');">'
    +(z?_posEsc(z.nom):(V?'↩ VOZVRAT':'↑ BERISH'))+'</span>';
  // POS 1.13: o'ng pastdagi versiya belgisi berish oynasi ochiqda ko'rinmay
  // qolardi (Ibrohim telefonda). Shu sababli tepa satrga ham chiqarildi.
  // Matn _verBelgi() dan — POS rolida 'POS <ver>', boshqa rolda APP_VER.
  h+='<span style="font-size:9.5px;color:var(--muted);border:1px solid var(--border);border-radius:24px;padding:1px 7px;white-space:nowrap;flex:none;">'+_verBelgi()+'</span>';
  h+='<span style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;">'+_posEsc(k.nom)+'</span>';
  h+='<span style="flex:1;min-width:4px;"></span>';
  var jq=0; try{ jq=klientJamiQarz(k)||0; }catch(e){}
  h+='<span style="font-size:11px;color:var(--muted);white-space:nowrap;">Klient qarzi <b style="color:var(--red);font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums;">−'+fmtG(Math.abs(jq))+' g</b></span>';
  h+='<button onclick="posBBekor()" style="width:34px;height:34px;flex:none;border-radius:14px;border:1px solid var(--border);background:var(--surf2);color:var(--muted);cursor:pointer;font-size:14px;">&#10005;</button></div>';

  if(!z){
    // ══ EKRAN 1 — zavod tanlash ══
    h+='<div style="flex:1;min-height:0;display:flex;flex-direction:column;">';
    h+='<div style="flex:1;overflow-y:auto;padding:12px;"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;">';
    (data.zavodlar||[]).forEach(function(zz,i){
      var j=_pbZavodJami(i);
      h+='<div onclick="posBZavod('+i+')" style="position:relative;border:1px solid var(--border);background:var(--surf2);border-radius:18px;padding:14px 13px;cursor:pointer;min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:3px;">';
      if(j) h+='<span style="position:absolute;top:8px;right:9px;font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green);">'+fmtG(j.g)+' g · '+j.n+' dona</span>';
      h+='<b style="font-size:16px;font-weight:600;color:var(--'+C+');">'+_posEsc(zz.nom)+'</b>';
      h+='<span style="font-size:11px;color:var(--muted);">'+((zz.turlar||[]).length)+' ta tur</span></div>';
    });
    h+='</div></div>';
    // savat
    var J=_pbSavatJami();
    h+='<div style="border-top:1px solid var(--border);background:var(--bg);flex:none;max-height:210px;display:flex;flex-direction:column;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;flex:none;">';
    h+='<span style="font-size:9.5px;letter-spacing:.11em;color:var(--muted);">SAVAT</span>';
    h+='<span style="font-size:10.5px;color:var(--muted);">'+(_pbSavat.length?_pbSavat.length+' zavod · o\'zgartirish uchun bosing':'')+'</span></div>';
    h+='<div style="overflow-y:auto;padding:0 12px 8px;">';
    if(_pbSavat.length){
      _pbSavat.forEach(function(s,i){
        var zz=data.zavodlar[s.zi]; if(!zz) return;
        var agg=_pbTurlar(s), g=0;
        s.dona.forEach(function(d){ g+=d.g; });
        var turlar=agg.tartib.map(function(ti){
          return (zz.turlar[ti]?zz.turlar[ti].nom:'?')+' '+fmtG(agg.m[ti].g)+'g'; }).join(' · ');
        h+='<div onclick="posBSavatKir('+i+')" style="display:flex;align-items:center;gap:9px;padding:8px 0;font-size:12.5px;border-top:1px solid var(--border);cursor:pointer;">';
        h+='<div style="flex:1;min-width:0;"><b style="display:block;font-weight:500;font-size:13px;">'+_posEsc(zz.nom)+'</b>';
        h+='<small style="color:var(--muted);font-size:10.5px;">'+_posEsc(turlar)+'</small></div>';
        h+='<div style="text-align:right;font-weight:700;color:var(--'+C+');font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums;">'+fmtG(roundG(g))+' g'
          +'<small style="display:block;font-weight:400;color:var(--muted);font-size:10.5px;">'+s.dona.length+' dona</small></div>';
        h+='<div onclick="posBSavatOchir('+i+',event)" style="width:22px;flex:none;color:var(--muted);font-size:12px;text-align:center;cursor:pointer;">✕</div></div>';
      });
    } else h+='<div style="color:var(--muted);font-size:11.5px;padding:6px 2px 10px;">Bo\'sh — tepadan zavodni bosing</div>';
    h+='</div>';
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:9px 12px;border-top:1px solid var(--border);flex:none;">';
    h+='<span style="font-size:9.5px;letter-spacing:.11em;color:var(--muted);">JAMI</span>';
    h+='<span><span style="font-weight:700;font-size:17px;color:var(--green);font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums;">'+fmtG(J.g)+' g</span> '
      +'<span style="font-size:11px;color:var(--muted);">'+J.n+' dona</span></span></div></div></div>';
    h+='<div style="display:flex;gap:7px;justify-content:flex-end;padding:'+(PAST?'5px 9px':'9px 11px')+';border-top:1px solid var(--border);flex:none;">';
    h+='<button onclick="posBBekor()" style="height:'+(PAST?38:44)+'px;padding:0 18px;border-radius:16px;cursor:pointer;font-size:13.5px;border:1px solid var(--border);background:var(--surf2);color:var(--text);font-family:inherit;">Bekor</button>';
    h+='<button onclick="posBSaqla()"'+(_pbSavat.length?'':' disabled')+' style="height:'+(PAST?38:44)+'px;padding:0 18px;border-radius:16px;cursor:pointer;font-size:13.5px;font-weight:600;border:1px solid var(--'+C+');background:var(--'+C+');color:var(--on-gold);font-family:inherit;'+(_pbSavat.length?'':'opacity:.35;')+'">Tekshiruvga yuborish</button></div>';

  } else {
    // ══ EKRAN 2 — zavod ichi ══
    var t=z.turlar[_pbTi];
    h+='<div style="display:flex;gap:7px;padding:'+(PAST?'5px 9px':'9px 11px')+';border-bottom:1px solid var(--border);background:var(--bg);flex:none;overflow-x:auto;">';
    (z.turlar||[]).forEach(function(tt,j){
      var tg=_pbTurJami(j), on=_pbTi===j;
      var past = tg ? fmtG(tg)+' g' : (V?('qarz '+fmtG(_pbQarz(z.nom,tt.nom))+'g'):('omborda '+fmtG(_pbOst(_pbZi,j))+'g'));
      h+='<div onclick="posBTur('+j+')" style="padding:8px 16px;border-radius:15px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap;flex:none;text-align:center;border:1px solid '+(on?'var(--'+C+'-bd)':'var(--border)')+';background:'+(on?'var(--'+C+'-bg)':'var(--surf2)')+';color:'+(on?'var(--'+C+')':'var(--muted)')+';">'+_posEsc(tt.nom)
        +'<small style="display:block;font-family:Roboto,sans-serif;font-size:10px;font-weight:400;color:var(--muted);">'+past+'</small></div>';
    });
    h+='</div>';

    h+='<div style="display:flex;'+(TOR?'flex-direction:column;':'')+'min-height:0;flex:1;">';
    // ── CHAP: katakchalar (faqat gramm)
    h+='<div style="flex:1;'+(TOR?'min-width:0;border-bottom:1px solid var(--border);':'min-width:296px;border-right:1px solid var(--border);')+'display:flex;flex-direction:column;min-height:0;background:var(--bg);">';
    h+='<div style="flex:1;overflow-y:auto;padding:11px;">';
    if(_pbIch.length){
      // POS 1.24 (Ibrohim): «Oddiydan boshqa turga o'tganda spiska o'chsin».
      // Avval zavodning HAMMA turlari ustma-ust ko'rinardi — 3D ga o'tilsa ham
      // Oddiy ro'yxati turaverardi. Endi FAQAT tanlangan tur ko'rinadi.
      // Boshqa turlar yo'qolmaydi — savatga baribir tushadi, tur chipida
      // o'z grammi ko'rinib turadi.
      var korilgan=[_pbTi];
      korilgan.forEach(function(tj,si){
        var tg=0, tn=0; _pbIch.forEach(function(d){ if(d.ti===tj){ tg+=d.g; tn++; } });
        h+='<div style="'+(si?'margin-top:13px;':'')+'"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;margin-bottom:9px;border-bottom:1px solid var(--border);">';
        h+='<span style="font-size:12px;font-weight:600;color:var(--'+C+');">'+_posEsc(z.turlar[tj]?z.turlar[tj].nom:'?')+'</span>';
        h+='<span style="font-size:11.5px;color:var(--muted);font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums;">'+fmtG(roundG(tg))+' g · '+tn+' dona</span></div>';
        h+='<div style="display:grid;grid-template-columns:repeat('+(window.innerWidth>900?5:4)+',1fr);gap:8px;">';
        _pbIch.forEach(function(d,i){
          if(d.ti!==tj) return;
          var ng=d.g<0;
          h+='<div style="position:relative;border:1px solid '+(ng?'var(--red-bd)':'var(--border)')+';background:'+(ng?'var(--red-bg)':'var(--surf)')+';border-radius:16px;padding:11px 3px;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;">';
          h+='<span style="font-size:16px;font-weight:700;line-height:1.1;font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums;'+(ng?'color:var(--red);':'')+'">'+fmtG(d.g)+'</span>';
          h+='<span onclick="posBIchOchir('+i+')" style="position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:14px;border:1px solid var(--border);background:var(--surf2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;line-height:1;">✕</span></div>';
        });
        h+='</div></div>';
      });
    } else h+='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12px;text-align:center;padding:20px;">O\'ngdan gramm qo\'shing —<br>shu yerga tushadi</div>';
    h+='</div>';
    h+='<div style="border-top:1px solid var(--border);padding:11px;flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--surf2);">';
    h+='<span style="font-size:9.5px;letter-spacing:.11em;color:var(--muted);">JAMI · '+_pbIch.length+' dona</span>';
    h+='<span style="font-size:20px;font-weight:700;color:var(--'+C+');font-family:Roboto,sans-serif;font-variant-numeric:tabular-nums;">'+fmtG(_pbIchJami())+' g</span></div></div>';

    // ── O'NG: kiritish + klaviatura
    h+='<div style="'+(TOR?'width:auto;min-width:0;max-width:none;':'width:44%;min-width:286px;max-width:470px;')+'flex:none;display:flex;flex-direction:column;min-height:0;padding:10px;gap:8px;overflow-y:auto;">';
    var tg2=_pbTurJami(_pbTi);
    var IN='padding:8px 11px;border-radius:15px;font-size:11.5px;flex:none;line-height:1.45;';
    if(V){
      var q=_pbQarz(z.nom,t.nom), ortiq=roundG(tg2-q);
      if(q<=0.001) h+='<div style="'+IN+'border:1px solid var(--green-bd);background:var(--green-bg);color:var(--green);">Bu turda klient qarzi <b>yo\'q</b> — qaytgan'
        +(tg2?' <b>'+fmtG(tg2)+' g</b>':'')+' to\'liq <b>biz qarzdor</b> bo\'lib yoziladi</div>';
      else if(ortiq>0.001) h+='<div style="'+IN+'border:1px solid var(--green-bd);background:var(--green-bg);color:var(--green);">Klient qarzi <b>'+fmtG(q)+' g</b> — qarzdan <b>'+fmtG(ortiq)+' g</b> oshdi, oshgani <b>biz qarzdor</b> bo\'ladi</div>';
      else h+='<div style="'+IN+'border:1px solid var(--border);background:var(--bg);color:var(--muted);">Klient qarzi <b>'+fmtG(q)+' g</b> · qaytdi <b>'+fmtG(tg2)+' g</b> · qoladi <b>'+fmtG(roundG(q-tg2))+' g</b></div>';
    } else {
      var o=_pbOst(_pbZi,_pbTi);
      if(tg2>o+0.001) h+='<div style="'+IN+'border:1px solid var(--red-bd);background:var(--red-bg);color:var(--red);">⚠ '+_posEsc(t.nom)+' omborda <b>'+fmtG(o)+' g</b> — <b>'+fmtG(roundG(tg2-o))+' g</b> oshib ketdi (to\'xtatmaydi)</div>';
      else h+='<div style="'+IN+'border:1px solid var(--border);background:var(--bg);color:var(--muted);">'+_posEsc(t.nom)+' omborda <b>'+fmtG(o)+' g</b></div>';
    }
    h+='<div style="display:flex;gap:7px;flex:none;">';
    h+='<input id="pb-in" value="'+_posEsc(_pbKir)+'" oninput="posBKirSet(this.value)" onkeydown="if(event.key===\'Enter\')posBQoshDona()" inputmode="none" autocomplete="off" placeholder="'+_posEsc(t.nom)+' — gramm" style="flex:1;min-width:0;height:46px;border-radius:16px;padding:0 12px;font-size:16px;background:var(--bg);border:1px solid var(--'+C+'-bd);color:var(--text);outline:none;font-family:inherit;">';
    h+='<button onclick="posBNeg()" style="width:48px;flex:none;height:46px;border-radius:16px;cursor:pointer;font-size:19px;border:1px solid '+(_pbNeg?'var(--red-bd)':'var(--border)')+';background:'+(_pbNeg?'var(--red-bg)':'var(--surf2)')+';color:'+(_pbNeg?'var(--red)':'var(--text)')+';">'+(_pbNeg?'−':'±')+'</button>';
    h+='<button onclick="posBQoshDona()" style="width:48px;flex:none;height:46px;border-radius:16px;border:0;background:var(--'+C+');color:var(--on-gold);font-size:19px;cursor:pointer;">+</button></div>';
    if(_pbNeg) h+='<div style="font-size:11px;color:var(--red);padding:0 2px;flex:none;">keyingi qo\'shilgan gramm MINUS bo\'lib tushadi</div>';
    // POS 1.20 (Ibrohim): «gorizontal holatda yonida chiqsin, nega chiqmidi?»
    // POS 1.11 da past ekranda klaviatura YASHIRILARDI (5 qator 276px joy
    // so'rardi, modal esa 340px). Endi yashirilmaydi — past ekranda 5 USTUNGA
    // o'tadi va 3 qatorga sig'adi:  7 8 9 ⌫ C / 4 5 6 . 0 / 1 2 3 [Qo'shish]
    var KUST = PAST ? 5 : 3;
    var KBAL = PAST ? 38 : 46;
    var KS='min-height:'+KBAL+'px;border-radius:16px;border:1px solid var(--border);background:var(--surf2);color:var(--text);font-family:inherit;font-size:'+(PAST?16:18)+'px;cursor:pointer;';
    var KEY=function(x){ return '<button onclick="posBTuz(\''+x+'\')" style="'+KS+'">'+x+'</button>'; };
    var KDEL='<button onclick="posBTuz(\'del\')" style="'+KS+'">\u232b</button>';
    var KC='<button onclick="posBTuz(\'c\')" style="'+KS+'">C</button>';
    var KGO='<button onclick="posBQoshDona()" style="grid-column:span 2;min-height:'+KBAL+'px;border-radius:16px;border:1px solid var(--'+C+');background:var(--'+C+');color:var(--on-gold);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;">+ Qo\'shish</button>';
    h+='<div style="display:grid;grid-template-columns:repeat('+KUST+',1fr);gap:6px;flex:'+(PAST?'none':'1')+';'+(PAST?'':'min-height:290px;')+'">';
    if(PAST){
      h+=KEY(7)+KEY(8)+KEY(9)+KDEL+KC;
      h+=KEY(4)+KEY(5)+KEY(6)+KEY('.')+KEY(0);
      h+=KEY(1)+KEY(2)+KEY(3)+KGO;
    } else {
      h+=[7,8,9,4,5,6,1,2,3,'.',0].map(KEY).join('')+KDEL+KGO+KC;
    }
    h+='</div>';
    h+='</div></div>';

    h+='<div style="display:flex;gap:7px;justify-content:flex-end;padding:'+(PAST?'5px 9px':'9px 11px')+';border-top:1px solid var(--border);flex:none;">';
    h+='<button onclick="posBChiq()" style="height:'+(PAST?38:44)+'px;padding:0 18px;border-radius:16px;cursor:pointer;font-size:13.5px;border:1px solid var(--border);background:var(--surf2);color:var(--text);font-family:inherit;">Chiqish</button>';
    h+='<button onclick="posBSavatga()"'+(_pbIch.length?'':' disabled')+' style="flex:1;height:'+(PAST?38:44)+'px;border-radius:16px;cursor:pointer;font-size:13.5px;font-weight:600;border:1px solid var(--green-bd);background:var(--green-bg);color:var(--green);font-family:inherit;'+(_pbIch.length?'':'opacity:.35;')+'">'
      +(_pbSIdx(_pbZi)>=0?'✓ Savatda yangilab chiqish':'✓ Savatga qo\'shib chiqish')+'</button></div>';
  }

  box.innerHTML=h;
  var inp=document.getElementById('pb-in');
